<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sandhop Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a0e;--parch:#f3e4c2;--parch2:#e3cb9a;--red:#b3322a;--red2:#7c1a12;--gold:#d8a93b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120b06;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:'Alegreya Sans',system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,10,4,.45),rgba(20,10,4,.8))}
#ui.show{display:flex}
#ui.light{background:linear-gradient(rgba(20,10,4,.1),rgba(20,10,4,.55))}
.panel{background:linear-gradient(var(--parch),var(--parch2));border:.22em solid var(--ink);border-radius:.6em;box-shadow:0 .6em 2em rgba(0,0,0,.6),inset 0 0 0 .22em var(--gold);padding:1.2em 1.8em 1.4em;max-width:60em;max-height:94%;overflow:auto;text-align:center}
.panel.wide{width:58em}
h1,h2,h3{font-family:Cinzel,serif;margin:.1em 0 .3em;letter-spacing:.04em}
h2{font-size:2.1em;color:var(--red2)}
h3{font-size:1.15em;margin:.8em 0 .4em;color:var(--ink);border-bottom:.08em solid rgba(43,26,14,.3);padding-bottom:.2em}
p{margin:.35em 0;font-size:1.1em}
.sub{opacity:.8}
button{font-family:Cinzel,serif;font-weight:700;font-size:1.05em;background:linear-gradient(#c8402f,var(--red2));color:#fbeed0;border:.14em solid var(--ink);border-radius:.4em;padding:.45em 1.3em;margin:.3em;cursor:pointer;box-shadow:0 .2em 0 var(--ink);letter-spacing:.03em}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(.15em);box-shadow:none}
button:disabled{background:#9a8a70;color:#e4d8bd;cursor:not-allowed;filter:none}
button.alt{background:linear-gradient(#6a543c,#3b2c1d)}
button.big{font-size:1.45em;padding:.45em 1.8em}
button.tiny{font-size:.75em;padding:.3em .8em;background:transparent;color:var(--ink);box-shadow:none;border-color:rgba(43,26,14,.4)}
button.arrow{padding:.2em .7em;font-size:1.2em}
.title{display:flex;flex-direction:column;align-items:center;gap:1.4em;text-align:center}
.logo small{font-family:Cinzel,serif;color:#f7e3b0;font-size:1.3em;letter-spacing:.3em;text-shadow:0 .1em .3em #000}
.logo h1{font-size:5.6em;line-height:.92;color:#f7e3b0;text-shadow:0 .05em 0 var(--red2),0 .1em 0 var(--ink),0 .2em .5em rgba(0,0,0,.7);letter-spacing:.06em;margin:.05em 0}
.logo p{font-family:Cinzel,serif;color:#fbeed0;font-size:1.3em;text-shadow:0 .1em .3em #000}
.menu{display:flex;flex-direction:column;align-items:stretch;min-width:16em}
.foot{color:#f3e4c2;opacity:.75;font-size:.95em;text-shadow:0 .1em .2em #000}
.row{display:flex;justify-content:center;gap:1em;flex-wrap:wrap;margin:.3em 0 .6em}
.stat{background:rgba(43,26,14,.08);border:.08em solid rgba(43,26,14,.25);border-radius:.4em;padding:.3em .9em;font-size:1.1em}
.stat b{font-family:Cinzel,serif;color:var(--red2)}
.cols{display:flex;gap:1em;justify-content:center;margin:.6em 0;text-align:left}
.card{flex:1;background:rgba(255,255,255,.35);border:.1em solid rgba(43,26,14,.35);border-radius:.5em;padding:.6em 1em}
.card h3{margin-top:.1em}
.card p{font-size:1em;margin:.2em 0}
.pips{display:inline-flex;gap:.2em;vertical-align:middle}
.pip{display:block;width:.62em;height:.62em;border:.1em solid var(--red2);box-sizing:border-box}
.pip.on{background:var(--red2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.item{background:rgba(255,255,255,.35);border:.1em solid rgba(43,26,14,.35);border-radius:.5em;padding:.5em .6em;display:flex;flex-direction:column;align-items:center}
.item.eq{border-color:var(--red2);box-shadow:inset 0 0 0 .12em var(--red2)}
.iname{font-family:Cinzel,serif;font-weight:900;font-size:1.05em}
.idesc{font-size:.85em;min-height:2.4em;opacity:.85;margin:.2em 0}
.istats{font-size:.8em;margin-bottom:.2em}
.item button{font-size:.85em;padding:.3em 1em}
.tag{font-family:Cinzel,serif;font-size:.85em;color:var(--red2);padding:.4em}
.wprev{width:10em;height:2.5em}
.gold{font-family:Cinzel,serif;font-size:1.3em;color:#8a5a00}
.pick{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin:.4em 0;font-size:1.15em}
.pick span{min-width:7em;text-align:left}
.pick b{font-family:Cinzel,serif;min-width:8em}
.keys{margin:.4em auto;border-collapse:collapse;font-size:1.05em}
.keys td{padding:.25em .8em;border-bottom:.06em solid rgba(43,26,14,.2);text-align:left}
.keys td:first-child{font-weight:700}
kbd{font-family:inherit;background:#fff8e6;border:.08em solid var(--ink);border-bottom-width:.18em;border-radius:.25em;padding:0 .35em;font-size:.9em}
ul.tips{text-align:left;max-width:36em;margin:.6em auto;padding-left:1.2em}
ul.tips li{margin:.25em 0}
.result h1{font-size:3.6em}
.result.win h1{color:#8a5a00}
.result.lose h1{color:var(--red2)}
.reason{font-family:Cinzel,serif;font-size:1.3em}
.journey{margin:.2em 0 .5em;font-family:Cinzel,serif;font-size:1em}
.stop{opacity:.45;padding:.1em .35em}
.stop.done{opacity:.75;text-decoration:line-through}
.stop.here{opacity:1;color:var(--red2);font-weight:900;border-bottom:.12em solid var(--red2)}
.arrowj{opacity:.5}
.wine{margin-top:.5em;padding-top:.4em;border-top:.08em solid rgba(43,26,14,.25)}
.wine button{font-size:.85em;padding:.25em .9em}
.item.locked{opacity:.55}
.thumbs{font-family:Cinzel,serif;font-size:1.4em;min-height:1.5em}
.cprev{width:6em;height:7.5em}
.xp{height:.8em;background:rgba(43,26,14,.18);border-radius:.4em;overflow:hidden;margin:.4em 4em 0}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#d8a93b,#b3322a)}
.srow{display:flex;align-items:center;gap:.4em;margin:.2em 0}
.srow>span:first-child{width:2.6em;font-weight:700}
.srow .pips{flex:none;white-space:nowrap}
.srow button{flex:none;padding:0 .55em;margin:0 0 0 .3em;font-size:.9em}
.grid.g1{grid-template-columns:minmax(0,22em);justify-content:center}
.grid.g2{grid-template-columns:repeat(2,minmax(0,20em));justify-content:center}
table.graves td{font-size:.95em}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="ui"></div></div>
<script>
'use strict';
const W=1280,H=720,GROUND=645,WALL_L=34,WALL_R=W-34,DT=1/120,GRAV=2100,ITER=6,ARM=34,HIT_MIN=320,GFR=0.86;
const TAU=Math.PI*2;
const DEBUG=/debug/.test(location.hash);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrapA=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI};
const mirror=(a,f)=>f>0?a:Math.PI-a;

if(DEBUG)window.addEventListener('error',e=>{const p=document.createElement('pre');p.id='err';p.style.cssText='position:fixed;left:0;top:0;color:#f55;background:#000;z-index:9;margin:0';p.textContent='ERR '+e.message+' @'+e.lineno;document.body.appendChild(p)});

const WEAPONS={
 gladius:{name:'Gladius',type:'sword',len:60,bladeStart:0.22,dmg:1.0,speed:13,drive:0.24,tipInv:1.3,price:0,desc:'Quick and reliable. Every gladiator starts here.'},
 spear:{name:'Spear',type:'spear',len:118,bladeStart:0.84,dmg:1.3,speed:9.5,drive:0.2,tipInv:1.0,price:180,desc:'Long reach. Only the point bites, so hop in to stab.'},
 axe:{name:'Axe',type:'axe',len:76,bladeStart:0.68,dmg:1.45,speed:10.5,drive:0.2,tipInv:0.8,price:260,desc:'Heavy head, brutal chops. Great for taking limbs.'},
 mace:{name:'Mace',type:'mace',len:70,bladeStart:0.72,dmg:1.35,speed:10,drive:0.19,tipInv:0.7,price:340,blunt:true,desc:'Crushes skulls and stuns. Sends foes flying.'},
 greatsword:{name:'Greatsword',type:'great',len:108,bladeStart:0.2,dmg:1.5,speed:8.2,drive:0.16,tipInv:0.6,price:620,twoHanded:true,desc:'Huge reach, huge damage, slow to swing.'},
 trident:{name:'Trident',type:'trident',len:124,bladeStart:0.8,dmg:1.65,speed:9.5,drive:0.2,tipInv:0.9,price:900,desc:"The champion's choice. Three points of pain."},
};
const WKEYS=Object.keys(WEAPONS);
const ARMOR={
 helm:{name:'Galea Helmet',dr:0.35,price:160,desc:'Head damage -35%.'},
 chest:{name:'Breastplate',dr:0.3,price:240,desc:'Torso damage -30%.'},
 greaves:{name:'Greaves',dr:0.4,price:120,desc:'Leg damage -40%.'},
};
const SHIELDS={
 parma:{name:'Parma',desc:'Small round shield. Light and quick to raise.',hl:15,th:6,inv:1.0,hp:90,hopMul:1,price:140,col:'#b8923c',rim:'#7a5a1c'},
 scutum:{name:'Scutum',desc:'Tall legionary shield. Covers a lot, but it is heavy.',hl:27,th:7,inv:0.6,hp:160,hopMul:0.92,price:300,col:'#a4261c',rim:'#d8a93b'},
};
const SKEYS=Object.keys(SHIELDS);
const SARM=26;
const STATS={str:{name:'Strength',desc:'+7% damage per level, stronger swings'},agi:{name:'Agility',desc:'Higher hops, faster swings'},vit:{name:'Vitality',desc:'+8% health and blood per level'}};
const CLASSES={
 murmillo:{name:'Murmillo',weapon:'gladius',shield:'scutum',armor:{helm:true},stats:{str:2,agi:1,vit:2},mods:{},color:'#b3322a',plume:'#e8d24a',cost:0,desc:'Sword, big shield and helmet. A solid all-rounder.',trait:'Big scutum shield and a helmet'},
 hoplomachus:{name:'Hoplomachus',weapon:'spear',shield:'parma',armor:{greaves:true},stats:{str:1,agi:3,vit:1},mods:{hop:1.08},color:'#2f5fa8',plume:'#f0f0f0',cost:0,desc:'Spear and small shield. Keeps foes at bay.',trait:'+8% hop height'},
 barbarian:{name:'Barbarian',weapon:'axe',armor:{},stats:{str:4,agi:1,vit:1},mods:{dmg:1.1},color:'#6b4a2a',beard:true,cost:120,desc:'A northern captive who hits like a falling tree.',trait:'+10% damage'},
 secutor:{name:'Secutor',weapon:'mace',shield:'scutum',armor:{helm:true,chest:true},stats:{str:2,agi:0,vit:4},mods:{hp:1.15,hop:0.9},color:'#5a5f66',plume:'#a4261c',cost:200,desc:'Armored chaser. Hard to kill, slow to hop.',trait:'+15% health, -10% hop'},
 retiarius:{name:'Retiarius',weapon:'trident',armor:{},stats:{str:1,agi:5,vit:0},mods:{swing:1.15},color:'#2e7d5b',cost:300,desc:'Fast, fragile and deadly with a trident.',trait:'+15% swing speed'},
 gallus:{name:'Gallus',weapon:'greatsword',armor:{greaves:true},stats:{str:4,agi:0,vit:3},mods:{},color:'#8a4a8a',beard:true,cost:450,desc:'A Gaulish giant with an enormous blade.',trait:'Starts with a Greatsword'},
};
const CKEYS=Object.keys(CLASSES);
const TRAINERS={
 str:{name:'Strength Trainer',eff:L=>`Train STR to ${tcap(L)}${L>=3?`, +${sbonus(L)} starting STR`:''}`},
 agi:{name:'Agility Trainer',eff:L=>`Train AGI to ${tcap(L)}${L>=3?`, +${sbonus(L)} starting AGI`:''}`},
 vit:{name:'Vitality Trainer',eff:L=>`Train VIT to ${tcap(L)}${L>=3?`, +${sbonus(L)} starting VIT`:''}`},
 smith:{name:'Blacksmith',eff:L=>`Shop prices -${L*8}%, +${30+L*40} starting gold`},
 lanista:{name:'Lanista',eff:L=>`+${L*10}% gold and XP from fights`},
 medicus:{name:'Medicus',eff:L=>`${L*8}% chance to survive a lethal defeat (not beheading)`},
};
const TCOST=[40,80,140,220,320];
const tcap=L=>Math.min(10,3+Math.round(L*1.4));
const sbonus=L=>(L>=3?1:0)+(L>=5?1:0);
const trainCost=v=>50+v*25;
const xpNeed=lv=>80+lv*40;
const NAMES=['Lucius','Gaius','Marcus','Titus','Quintus','Decimus','Spurius','Aulus','Servius','Tiberius','Flavius','Crixus','Oenomaus','Gannicus','Varro','Draco','Kaeso','Priscus','Verus','Casca','Nerva','Rufus','Felix','Aurelia','Nubia','Severa','Octavia','Brennus','Ambiorix','Sura'];
const EPI=['the Timid','Pig-Farmer','Longarm','the Butcher','Ironhide','the Swift','the Red','the Hungry','One-Eye','the Grim','the Unbroken','of Capua','the Gaul','the Thracian','Bonecrusher','the Quiet','the Lucky','Half-Ear'];
const HAIRS=['#3b2414','#1a120c','#6b3a1a','#a8742e','#d9b25a','#7a2a14'];
const SKINTONES=['#e0b08a','#d6a174','#c68d62','#a0694a','#7a4a30','#f0c8a0'];
const randName=()=>pick(NAMES)+' '+pick(EPI);
const randLook=c=>({skin:pick(SKINTONES),hair:pick(HAIRS),beard:!!(c&&c.beard)||Math.random()<0.25});
const OPP=[
 {name:'Lucius the Timid',weapon:'gladius',ai:0.12,color:'#7d8a3c'},
 {name:'Gaius Pig-Farmer',weapon:'axe',ai:0.22,color:'#8a6a3a'},
 {name:'Spurius Longarm',weapon:'spear',ai:0.3,color:'#3d6e8c'},
 {name:'Big Flavius',weapon:'mace',ai:0.38,color:'#6b4a8a',armor:{helm:true},stats:{vit:2}},
 {name:'Nubia the Swift',weapon:'spear',ai:0.48,color:'#2e7d5b',stats:{agi:3}},
 {name:'Crixus',weapon:'axe',ai:0.56,color:'#2b2b6b',armor:{chest:true},stats:{str:2,vit:1}},
 {name:'The Butcher',weapon:'greatsword',ai:0.64,color:'#4a4a4a',armor:{helm:true},stats:{str:3,vit:2}},
 {name:'Aurelia',weapon:'trident',ai:0.74,color:'#1f4f7a',armor:{chest:true,greaves:true},stats:{agi:3,vit:2}},
 {name:'Titus Ironhide',weapon:'mace',ai:0.84,color:'#5a5f66',armor:{helm:true,chest:true,greaves:true},stats:{str:3,vit:4}},
 {name:'The Champion',weapon:'greatsword',ai:0.95,color:'#c9962c',plume:'#a4261c',armor:{helm:true,chest:true,greaves:true},stats:{str:5,agi:4,vit:5}},
];
const OPP_COLORS=['#7d8a3c','#8a6a3a','#3d6e8c','#6b4a8a','#2e7d5b','#2b2b6b','#4a4a4a','#1f4f7a','#5a5f66','#8c5a2e','#7a1f4f'];
function genOpp(stage,diff){
 const s=Math.max(0,stage+diff*1.2),ck=pick(CKEYS),c=CLASSES[ck];
 const st=Object.assign({},c.stats);
 const pts=Math.max(0,Math.round(s*1.0+rand(-1,1)));
 for(let i=0;i<pts;i++){const k=pick(['str','agi','vit']);if(st[k]<10)st[k]++}
 const armor=Object.assign({helm:false,chest:false,greaves:false},c.armor);
 for(const k in ARMOR)if(Math.random()<clamp(s*0.09,0,0.85))armor[k]=true;
 const weapon=Math.random()<clamp(s*0.07,0,0.5)?pick(WKEYS):c.weapon;
 const shield=WEAPONS[weapon].twoHanded?null:c.shield&&Math.random()<0.8?c.shield:Math.random()<clamp(0.1+s*0.07,0,0.5)?pick(SKEYS):null;
 const m=1+diff*0.4;
 return{name:randName(),cls:ck,color:pick(OPP_COLORS),plume:pick(['#e8d24a','#f0f0f0','#a4261c','#2f5fa8']),weapon,shield,armor,stats:st,mods:c.mods,look:randLook(c),
  ai:clamp(0.06+s*0.08,0.05,1),diff,gold:Math.round((50+stage*30)*m),xp:Math.round((60+stage*15)*(1+diff*0.35)),fame:Math.max(5,Math.round(10+stage*5+diff*5))};
}
function champion(){return{name:'The Champion',cls:'gallus',color:'#c9962c',plume:'#a4261c',weapon:'greatsword',armor:{helm:true,chest:true,greaves:true},stats:{str:8,agi:7,vit:8},mods:{},look:{skin:'#c68d62',hair:'#1a120c',beard:true},ai:0.95,diff:1,boss:true,gold:500,xp:400,fame:120,wine:2,corner:{name:'The Emperor\'s steward',heal:0.35,err:80}}}
const CORNERS={
 drusus:{name:'Old Drusus',desc:'A retired gladiator with a shaky throwing arm.',cost:30,heal:0.25,err:170,caps:[1,2,3],up:[60,120]},
 livia:{name:'Livia the Vintner',desc:'Throws straight and pours strong wine.',cost:180,heal:0.35,err:90,caps:[1,2,3,4],up:[100,180,260]},
 silenus:{name:'Silenus',desc:'Priest of Bacchus. His wine also stops bleeding.',cost:450,heal:0.45,err:60,caps:[2,3,4,5],up:[200,300,400],cure:true},
};
const VILLAGES=['Vicus Nemo','Goat Hollow','Saltmarsh Ring','Olive Grove Pit','Mudbank of Luca','Crow Hill'];
const AREAS=[
 {name:null,short:null,theme:'village'},
 {name:'Arena of Nemausus',short:'Nemausus',theme:'town'},
 {name:'Amphitheatre of Pompeii',short:'Pompeii',theme:'pompeii'},
 {name:'Amphitheatre of Capua',short:'Capua',theme:'capua'},
 {name:'The Colosseum',short:'Rome',theme:'colosseum'},
];
const BOUTS=3;
const areaName=r=>r.area===0?r.village:AREAS[r.area].name;
const areaShort=(r,i)=>i===0?r.village:AREAS[i].short;
const effStage=r=>r.grand?10+(r.defenses||0)*0.5:r.area*2+r.bout*0.6;
const boutLabel=r=>r.grand?`The Colosseum · Title defense ${(r.defenses||0)+1}`:`${areaName(r)} · ${r.bout>=BOUTS?'Champion bout':`Bout ${r.bout+1} of ${BOUTS}`}`;
function areaChampion(r){
 const a=r.area;
 if(a===AREAS.length-1){const c=champion();c.name='Flamma, Champion of Rome';return c}
 const o=genOpp(a*2+2,1);
 o.name=pick(NAMES)+' '+pick(['the Unbeaten','the Lion','the Undying','the Red Death','Ironjaw','the Wall']);
 o.boss=true;o.ai=clamp(0.25+a*0.17,0.2,0.95);
 o.gold=Math.round(o.gold*1.8);o.xp=Math.round(o.xp*1.6);o.fame=Math.round(o.fame*1.5)+20*(a+1);
 if(a>=1){o.wine=1;o.corner={name:'Their trainer',heal:0.3,err:110}}
 return o;
}
function makeChoices(r){
 const e=effStage(r);
 if(r.grand)return[genOpp(e,0),genOpp(e,1)];
 if(r.bout>=BOUTS)return[areaChampion(r)];
 const L=[genOpp(e,-1),genOpp(e,0),genOpp(e,1)];if(Math.random()<0.35)L[2]=genBeast(r);return L;
}

/* ---------- save ---------- */
const SAVE_KEY='sandhop_arena_v2';
const freshMeta=()=>({fame:0,trainers:{str:0,agi:0,vit:0,smith:0,lanista:0,medicus:0},classes:['murmillo','hoplomachus'],graves:[],best:0,runs:0,diff:1,corners:{},corner:null,bestArea:0});
const DIFFS=[{l:'Easy',taken:0.55,ai:0.7,stun:0.3},{l:'Normal',taken:0.8,ai:0.85,stun:0.6},{l:'Hard',taken:1,ai:1,stun:1}];
let save={meta:freshMeta(),run:null};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.meta){save.meta=Object.assign(freshMeta(),s.meta);save.meta.trainers=Object.assign(freshMeta().trainers,s.meta.trainers);save.run=s.run&&CLASSES[s.run.cls]?s.run:null}}catch(e){}
if(save.run&&save.run.area===undefined){const r=save.run;r.area=0;r.bout=Math.min(r.stage||0,BOUTS);r.village=pick(VILLAGES);r.wine=0;r.choices=null}
function activeCorner(){const M=save.meta,k=M.corner,L=(M.corners||{})[k];if(!k||L===undefined||!CORNERS[k])return null;const d=CORNERS[k];return{key:k,name:d.name,level:L,cap:d.caps[L],heal:d.heal+0.03*L,err:d.err,cure:!!d.cure}}
const winePrice=()=>shopPrice(25);
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
const shopPrice=p=>Math.round(p*(1-0.08*save.meta.trainers.smith));
function newRun(ck,name,look){
 const c=CLASSES[ck],T=save.meta.trainers;
 return{name,cls:ck,look,level:1,xp:0,pts:0,
  stats:{str:c.stats.str+sbonus(T.str),agi:c.stats.agi+sbonus(T.agi),vit:c.stats.vit+sbonus(T.vit)},
  gold:30+40*T.smith,owned:[c.weapon],weapon:c.weapon,shield:c.shield||null,shields:c.shield?[c.shield]:[],armor:Object.assign({helm:false,chest:false,greaves:false},c.armor),
  area:0,bout:0,village:pick(VILLAGES),wine:0,wins:0,choices:null};
}

/* ---------- physics ---------- */
class Pt{

}
const vel=p=>[(p.x-p.px)/DT,(p.y-p.py)/DT];
const setVel=(p,vx,vy)=>{p.px=p.x-vx*DT;p.py=p.y-vy*DT};
const addVel=(p,vx,vy)=>{p.px-=vx*DT;p.py-=vy*DT};
class Con{
 constructor(a,b){this.a=a;this.b=b;this.len=Math.hypot(b.x-a.x,b.y-a.y);this.tag=''}
 solve(){const a=this.a,b=this.b,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,w=a.inv+b.inv;const k=(d-this.len)/(d*w);a.x+=dx*k*a.inv;a.y+=dy*k*a.inv;b.x-=dx*k*b.inv;b.y-=dy*k*b.inv}
}
function segSeg(p1x,p1y,q1x,q1y,p2x,p2y,q2x,q2y){
 const d1x=q1x-p1x,d1y=q1y-p1y,d2x=q2x-p2x,d2y=q2y-p2y,rx=p1x-p2x,ry=p1y-p2y;
 const a=d1x*d1x+d1y*d1y,e=d2x*d2x+d2y*d2y,f=d2x*rx+d2y*ry;
 let s,t;
 if(a<=1e-6&&e<=1e-6){s=0;t=0}
 else if(a<=1e-6){s=0;t=clamp(f/e,0,1)}
 else{
  const c=d1x*rx+d1y*ry;
  if(e<=1e-6){t=0;s=clamp(-c/a,0,1)}
  else{
   const b=d1x*d2x+d1y*d2y,den=a*e-b*b;
   s=den>1e-9?clamp((b*f-c*e)/den,0,1):0;
   t=(b*s+f)/e;
   if(t<0){t=0;s=clamp(-c/a,0,1)}else if(t>1){t=1;s=clamp((b-c)/a,0,1)}
  }
 }
 const c1x=p1x+d1x*s,c1y=p1y+d1y*s,c2x=p2x+d2x*t,c2y=p2y+d2y*t,nx=c1x-c2x,ny=c1y-c2y;
 return{s,t,d:Math.hypot(nx,ny),nx,ny,cx:(c1x+c2x)/2,cy:(c1y+c2y)/2};
}
function clampBounds(p){
 if(p.y>GROUND-p.r)p.y=GROUND-p.r;
 if(p.x<WALL_L+p.r)p.x=WALL_L+p.r;else if(p.x>WALL_R-p.r)p.x=WALL_R-p.r;
}
function contact(p){
 p.gc=false;
 if(p.y>=GROUND-p.r-0.5){
  p.gc=true;
  const vx=p.x-p.px;p.px=p.x-vx*GFR;
  if(p.y-p.py>0)p.py=p.y;
 }
}

class AI{
 constructor(me,lvl){this.me=me;this.L=lvl;me.omega*=0.65+0.35*lvl;this.state='guard';this.t=rand(0.6,1.2);this.hopT=rand(0.2,0.6);this.didHop=false;this.seed=Math.random()*10;this.blockT=0}
 update(dt,en){
  const me=this.me,c=me.ctrl,L=this.L,f=me.f;
  c.hop=0;c.lean=0;c.block=false;
  if(!me.alive||me.downed)return;
  const aimAt=p=>Math.atan2(p.y-me.neck.y,p.x-me.neck.x);
  if(!en.alive){c.rot=0;c.aim=mirror(-1.45,f);return}
  const dx=en.pelvis.x-me.pelvis.x,ad=Math.abs(dx),dir=dx>0?1:-1;
  this.t-=dt;this.hopT-=dt;
  if(!me.hasArm){
   c.aim=null;c.rot=0;
   if(this.hopT<=0&&me.grounded){this.hopT=rand(0.4,1);c.hop=me.pelvis.x<WALL_L+90?1:me.pelvis.x>WALL_R-90?-1:-dir}
   return;
  }
  const reach=ARM+me.w.len,poke=me.w.type==='spear'||me.w.type==='trident';
  const want=poke?reach*0.8:reach*0.55+26;
  if(me.wine>0&&me.corner&&me.blood<me.maxBlood*0.45&&Math.random()<0.02)callWine(me);
  const fl=game.flasks.find(q=>q.owner===me&&q.landed);
  if(fl&&me.grounded&&Math.abs(fl.x-me.pelvis.x)>20)c.hop=fl.x>me.pelvis.x?1:-1;
  else if(this.hopT<=0&&me.grounded){
   this.hopT=rand(0.3,1.0)*(1.35-L*0.7);
   if(ad>want+60)c.hop=dir;
   else if(ad<want-50&&Math.random()<0.5+L*0.3)c.hop=-dir;
   else if(Math.random()<0.2)c.hop=Math.random()<0.5?dir:-dir;
   if(me.pelvis.x<WALL_L+90)c.hop=1;else if(me.pelvis.x>WALL_R-90)c.hop=-1;
  }

  if(this.blockT>0){this.blockT-=dt;c.block=true}
  else if(me.sh&&en.hasArm){const v=vel(en.tip);if(Math.hypot(v[0],v[1])>500&&Math.hypot(en.tip.x-me.neck.x,en.tip.y-me.neck.y)<170&&Math.random()<0.02+L*0.1)this.blockT=rand(0.3,0.5)}

   const v=vel(en.tip);
   if(Math.hypot(v[0],v[1])>650&&Math.hypot(en.tip.x-me.neck.x,en.tip.y-me.neck.y)<150){this.state='parry';this.t=0.28}

     if(poke&&Math.random()<0.7){this.state='thrust';this.t=0.55;this.didHop=false}
     else{this.state='windup';this.t=0.7}

   case 'windup':

    break;
   case 'strike':

    if((rel>1.0&&rel<2.6)||this.t<=0){this.state='guard';this.t=rand(0.4,1.3)*(1.8-L)}
    break;
   case 'thrust':
    c.rot=0;c.aim=aimAt(en.neck)+wob*0.5;

    if(this.t<=0){this.state='guard';this.t=rand(0.2,0.9)*(1.5-L)}
    break;
   case 'parry':
    c.rot=0;c.aim=mirror(-1.3,f);
    if(this.t<=0){this.state='guard';this.t=rand(0.05,0.3)}
    break;
  }

}

function allPts(){

 for(const f of game.fighters)for(const p of f.pts)a.push(p);

function bodyPts(F){const a=[F.neck,F.pelvis];if(F.hasHead)a.push(F.head);if(F.hasLegL)a.push(F.footL);if(F.hasLegR)a.push(F.footR);return a}
function bodyPush(A,B){
 const pa=bodyPts(A),pb=bodyPts(B);
 for(const p of pa)for(const q of pb){
  const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),r=p.r+q.r;
  if(d<r&&d>1e-4){const k=(r-d)/d*0.5;p.x-=dx*k;p.y-=dy*k;q.x+=dx*k;q.y+=dy*k}
 }
 const s=segSeg(A.neck.x,A.neck.y,A.pelvis.x,A.pelvis.y,B.neck.x,B.neck.y,B.pelvis.x,B.pelvis.y);
 if(s.d<20){
  let nx,ny;if(s.d>1e-4){nx=s.nx/s.d;ny=s.ny/s.d}else{nx=A.pelvis.x<B.pelvis.x?-1:1;ny=0}
  const o=(20-s.d)*0.25;
  A.neck.x+=nx*o;A.neck.y+=ny*o;A.pelvis.x+=nx*o;A.pelvis.y+=ny*o;
  B.neck.x-=nx*o;B.neck.y-=ny*o;B.pelvis.x-=nx*o;B.pelvis.y-=ny*o;
 }
}
function shieldBlock(A,B){
 const S=B.shieldSeg(),h=A.hand,t=A.tip,th=B.sh.th;
 const r=segSeg(h.x,h.y,t.x,t.y,S.x1,S.y1,S.x2,S.y2);
 if(r.d>=th)return;
 let nx,ny;if(r.d>1e-4){nx=r.nx/r.d;ny=r.ny/r.d}else{nx=S.ux;ny=S.uy}
 const o=th-r.d,q=B.shp;
 h.x+=nx*o*(1-r.s);h.y+=ny*o*(1-r.s);t.x+=nx*o*r.s;t.y+=ny*o*r.s;
 q.x-=nx*o*0.3;q.y-=ny*o*0.3;
 const hv=vel(h),tv=vel(t),qv=vel(q);
 const rvx=hv[0]+(tv[0]-hv[0])*r.s-qv[0],rvy=hv[1]+(tv[1]-hv[1])*r.s-qv[1];
 const rel=rvx*nx+rvy*ny;
 if(rel<0){const j=-rel*0.6;addVel(t,nx*j*r.s,ny*j*r.s);addVel(h,nx*j*(1-r.s),ny*j*(1-r.s));addVel(q,-nx*j*0.25,-ny*j*0.25);addVel(B.neck,-nx*j*0.08,-ny*j*0.08)}
 const sp=Math.hypot(rvx,rvy);
 if(sp>HIT_MIN&&!(A.hitCD.shield>0)){
  A.hitCD.shield=0.25;
  for(const k of ['head','torso','arm','legL','legR'])A.hitCD[k]=Math.max(A.hitCD[k]||0,0.22);
  const dmg=(sp-280)*0.04*A.w.dmg*A.dmgMul*(A.w.blunt?1.5:1)*(B.block?0.6:1);
  spawnSparks(r.cx,r.cy,6+(dmg/3|0));sfx.clang(Math.min(1,sp/1100));game.shake=Math.max(game.shake,Math.min(8,dmg*0.2));
  if(dmg>10)addText('BLOCKED',r.cx,r.cy-24,20,'#cfe3ff',0.7);
  if(!A.dummy&&!B.dummy){
   B.shHP-=dmg;
   if(A.w.blunt&&dmg>30)B.stun=Math.max(B.stun,0.25);
   if(B.shHP<=0)B.breakShield();
  }
 }
}
function combat(A,B){
 if(!A.hasArm||A.downed||game.mercy)return;
 const w=A.w,h=A.hand,t=A.tip,bs=w.bladeStart;
 if(B.sh)shieldBlock(A,B);
 const bx=h.x+(t.x-h.x)*bs,by=h.y+(t.y-h.y)*bs;
 for(const P of B.parts()){
  const r=segSeg(bx,by,t.x,t.y,P.a.x,P.a.y,P.b.x,P.b.y);
  const lim=P.r+3;
  if(r.d>=lim)continue;
  const u=bs+(1-bs)*r.s;
  const hv=vel(h),tv=vel(t),av=vel(P.a),bv=vel(P.b);
  const rvx=hv[0]+(tv[0]-hv[0])*u-(av[0]+(bv[0]-av[0])*r.t);
  const rvy=hv[1]+(tv[1]-hv[1])*u-(av[1]+(bv[1]-av[1])*r.t);
  const sp=Math.hypot(rvx,rvy);
  if(sp>HIT_MIN&&!(A.hitCD[P.k]>0)){
   A.hitCD[P.k]=0.3;
   if(A.dummy){addText('HIT!',r.cx,r.cy-14,22,'#ff9a6a',0.7);sfx.hit(6)}
   else{
    const mult=P.k==='head'?1.7:P.k==='torso'?1:0.8;
    const dmg=(sp-280)*0.04*w.dmg*A.dmgMul*mult*(1-B.armorDR(P.k));
    B.takeHit(P.k,dmg,r.cx,r.cy,rvx,rvy,A);
   }
  }
  if(P.k==='head'||P.k==='torso'){
   let nx,ny;if(r.d>1e-4){nx=r.nx/r.d;ny=r.ny/r.d}else{nx=0;ny=-1}
   const o=(lim-r.d)*0.4;
   t.x+=nx*o;t.y+=ny*o;
   P.a.x-=nx*o*0.5;P.a.y-=ny*o*0.5;P.b.x-=nx*o*0.5;P.b.y-=ny*o*0.5;
  }
 }
}
function clash(A,B){
 if(!A.hasArm||!B.hasArm)return;
 const r=segSeg(A.hand.x,A.hand.y,A.tip.x,A.tip.y,B.hand.x,B.hand.y,B.tip.x,B.tip.y);
 const lim=7;if(r.d>=lim)return;
 let nx,ny;if(r.d>1e-4){nx=r.nx/r.d;ny=r.ny/r.d}else{nx=0;ny=-1}
 const o=(lim-r.d)*0.5;
 A.hand.x+=nx*o*(1-r.s);A.hand.y+=ny*o*(1-r.s);A.tip.x+=nx*o*r.s;A.tip.y+=ny*o*r.s;
 B.hand.x-=nx*o*(1-r.t);B.hand.y-=ny*o*(1-r.t);B.tip.x-=nx*o*r.t;B.tip.y-=ny*o*r.t;
 const ah=vel(A.hand),at=vel(A.tip),bh=vel(B.hand),bt=vel(B.tip);
 const rx=ah[0]+(at[0]-ah[0])*r.s-(bh[0]+(bt[0]-bh[0])*r.t);
 const ry=ah[1]+(at[1]-ah[1])*r.s-(bh[1]+(bt[1]-bh[1])*r.t);
 const rel=rx*nx+ry*ny;
 if(rel<0){const j=-rel*0.5;addVel(A.tip,nx*j,ny*j);addVel(B.tip,-nx*j,-ny*j)}
 const sp=Math.hypot(rx,ry);
 if(sp>260&&game.clashCD<=0){game.clashCD=0.12;spawnSparks(r.cx,r.cy,10+(sp/60|0));sfx.clang(Math.min(1,sp/1200));game.shake=Math.max(game.shake,3)}
}

function step(){
 const F=game.fighters;
 if(game.clashCD>0)game.clashCD-=DT;
 for(const f of F)f.think(DT);
 const all=allPts();
 for(const p of all)p.integrate();
 for(const f of F)f.drives();
 for(let i=0;i<ITER;i++){
  for(const f of F)for(const c of f.cons)c.solve();
  for(const d of game.debris)for(const c of d.cons)c.solve();
  if(F.length===2)bodyPush(F[0],F[1]);
  for(const p of all)clampBounds(p);
 }
 for(const p of all)contact(p);
 for(const f of F)f.grounded=(f.hasLegL&&f.footL.gc)||(f.hasLegR&&f.footR.gc)||(!f.hasLegL&&!f.hasLegR&&f.pelvis.gc);
 if(F.length===2){combat(F[0],F[1]);combat(F[1],F[0]);clash(F[0],F[1]);beastAttack(F[0],F[1]);beastAttack(F[1],F[0])}

 }

const sfx=(()=>{
 let ac=null,out=null,nb=null,muted=false,amb=null;
 const init=()=>{if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();out=ac.createGain();out.gain.value=0.55;out.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}};

function drawWeapon(g,hx,hy,tx,ty,w,sg){

   g.fillStyle=gold;g.fillRect(gp-1,-(bw+4),3.5,(bw+4)*2);
   g.beginPath();g.moveTo(gp+2,-bw);g.lineTo(L-10,-bw*0.85);g.lineTo(L,0);g.lineTo(L-10,bw*0.85);g.lineTo(gp+2,bw);g.closePath();
   g.fillStyle=steel;g.fill();g.strokeStyle=steelD;g.lineWidth=1;g.stroke();line(g,gp+5,0,L-12,0);
   g.fillStyle=gold;g.beginPath();g.arc(-5,0,3,0,TAU);g.fill();
   break}

   g.strokeStyle=wood;g.lineWidth=4;line(g,-14,0,L-16,0);
   g.fillStyle=steel;g.beginPath();g.moveTo(L-20,-5);g.lineTo(L+2,0);g.lineTo(L-20,5);g.lineTo(L-24,0);g.closePath();g.fill();g.strokeStyle=steelD;g.lineWidth=1;g.stroke();
   break}
  case 'trident':{
   g.strokeStyle=wood;g.lineWidth=4;line(g,-14,0,L-20,0);
   g.strokeStyle=steel;g.lineWidth=3.2;line(g,L-22,-9,L-22,9);line(g,L-22,0,L-2,0);line(g,L-22,-9,L-6,-9);line(g,L-22,9,L-6,9);
   g.fillStyle=steel;
   for(const [px,py] of [[L+2,0],[L-2,-9],[L-2,9]]){g.beginPath();g.moveTo(px,py);g.lineTo(px-9,py-3.5);g.lineTo(px-9,py+3.5);g.closePath();g.fill()}
   break}
  case 'axe':{
   g.strokeStyle=wood;g.lineWidth=4.5;line(g,-6,0,L+2,0);
   g.fillStyle=steel;g.beginPath();g.moveTo(L-18,0);g.lineTo(L-4,0);g.lineTo(L+4,20*sg);g.quadraticCurveTo(L-12,13*sg,L-26,20*sg);g.closePath();g.fill();g.strokeStyle=steelD;g.lineWidth=1.2;g.stroke();
   break}
  case 'mace':{
   g.strokeStyle=wood;g.lineWidth=4.5;line(g,-6,0,L-6,0);
   g.fillStyle='#4f555c';
   for(let i=0;i<8;i++){const t=i/8*TAU;g.beginPath();g.moveTo(L-3+Math.cos(t-0.35)*8,Math.sin(t-0.35)*8);g.lineTo(L-3+Math.cos(t)*15,Math.sin(t)*15);g.lineTo(L-3+Math.cos(t+0.35)*8,Math.sin(t+0.35)*8);g.closePath();g.fill()}
   g.fillStyle='#6d747c';g.beginPath();g.arc(L-3,0,9.5,0,TAU);g.fill();
   g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(L-6,-3,3,0,TAU);g.fill();
   break}
 }

}

 if(!F.hasLegL||!F.hasLegR)drawStump(p.x,p.y+4);

 if(F.hasArm){

 g.setTransform(RS*z,0,0,RS*z,(ox+sx)*RS,(oy+sy)*RS);

 for(const f of F)drawFighter(f);

 for(const p of game.fx){
  if(p.t==='b'){g.fillStyle='#9a1010';g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  else if(p.t==='w'){g.fillStyle='#b868e0';g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  else{g.strokeStyle='#ffe38a';g.lineWidth=2;line(g,p.x,p.y,p.x-p.vx*0.02,p.y-p.vy*0.02)}

 for(const t of game.texts){
  const a=clamp(1-t.t/t.life,0,1);g.globalAlpha=Math.min(1,a*2.5);
  g.font=`900 ${t.size|0}px Cinzel, serif`;g.textAlign='center';g.lineWidth=5;g.strokeStyle='#2b1a0e';g.strokeText(t.s,t.x,t.y);g.fillStyle=t.c;g.fillText(t.s,t.x,t.y);

}

/* ---------- update ---------- */
function update(dt){
 game.time+=dt;
 let sc=1;if(game.slowT>0){game.slowT-=dt;sc=0.3}
 const sdt=dt*sc,F=game.fighters;
 if(F.length===2){
  for(let i=0;i<2;i++){
   const f=F[i],e=F[1-i];f.faceToward(e);
   if(game.cd>0||game.mercy||f.downed){f.ctrl.hop=0;f.ctrl.rot=0;f.ctrl.aim=null;f.ctrl.lean=0;f.ctrl.block=false;continue}
   if(f.ai)f.ai.update(sdt,e);else if(f.ctrlType!=='dummy')readInput(f);
  }
 }
 game.acc+=sdt;let n=0;
 while(game.acc>=DT&&n<10){step();game.acc-=DT;n++}
 if(n>=10)game.acc=0;
 for(const f of F)f.frame(sdt);
 if(game.match&&game.match.career&&!game.ended&&!game.mercy&&F.length===2&&!F.some(q=>q.beast)){
  for(let i=0;i<2;i++){
   const f=F[i];if(!f.alive||f.mercyRolled)continue;
   if(f.blood<f.maxBlood*0.3||!f.hasArm||f.legs()===0){f.mercyRolled=true;if(Math.random()<0.6){startMercy(i);break}}
  }
 }
 if(game.mercy&&!game.mercy.shown){game.mercy.t-=dt;if(game.mercy.t<=0){game.mercy.shown=true;mercyScreen()}}
 for(const d of game.debris){
  if(d.kind==='head'||d.kind==='bhead'){const v=vel(d.pts[0]);d.rot+=v[0]*sdt/15}
  if(d.bt>0){d.bt-=sdt;if(Math.random()<0.5){const p=d.pts[0],v=vel(p);spawnDrop(p.x,p.y,v[0]*0.5+rand(-40,40),v[1]*0.5+rand(-60,20))}}
 }
 const fx=game.fx;
 for(let i=fx.length-1;i>=0;i--){
  const p=fx[i];p.vy+=1500*sdt;p.x+=p.vx*sdt;p.y+=p.vy*sdt;p.life-=sdt;
  let kill=p.life<=0;
  if(p.t==='b'&&p.vy>0&&p.y>=p.land){kill=true;dctx.fillStyle=`rgba(${110+Math.random()*40|0},8,8,.85)`;dctx.beginPath();dctx.ellipse(p.x,p.land,p.s*1.7,p.s*0.6,0,0,TAU);dctx.fill()}
  if(kill){fx[i]=fx[fx.length-1];fx.pop()}
 }
 updateFlasks(sdt);updateCoins(sdt);
 if(game.zoom){game.zoom.t+=dt;if(game.zoom.t>2.3)game.zoom=null}
 game.ambT=(game.ambT||0)-dt;if(game.ambT<=0){game.ambT=0.3;sfx.ambient(!game.match?0:game.match.demo?0.012:0.025+game.excite*0.03)}
 for(let i=game.texts.length-1;i>=0;i--){const t=game.texts[i];t.t+=dt;t.y-=30*dt;if(t.t>=t.life)game.texts.splice(i,1)}
 game.shake*=Math.exp(-dt*9);
 game.excite=Math.max(0.3,game.excite-dt*0.35);
 const wasCd=game.cd>0;game.cd-=dt;if(wasCd&&game.cd<=0&&game.match&&!game.match.demo)sfx.gong();
 if(game.hintT>0&&game.cd<0)game.hintT-=dt;
 if(game.ended&&!game.endCalled){game.endT-=dt;if(game.endT<=0){game.endCalled=true;game.match.onEnd(game.winner)}}
}
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(!game.paused)update(dt);
 render();
 requestAnimationFrame(loop);
}

function startMatch(m){setTheme(m.theme||'colosseum');game.match=m;game.round=1;clearDecals();startRound()}
function startRound(){
 const m=game.match;
 const mk=(o,x,f)=>o.beast?new Beast(o,x,f):new Fighter(o,x,f),A=mk(m.a,W*0.32,1),B=mk(m.b,W*0.68,-1);
 if(m.a.ctrl==='ai')A.ai=new AI(A,m.a.ai);
 if(m.b.ctrl==='ai')B.ai=m.b.beast?new BeastAI(B,m.b.ai):new AI(B,m.b.ai);
 if(!m.demo&&(A.ai?1:0)+(B.ai?1:0)===1){const D=DIFFS[save.meta.diff]||DIFFS[1];for(const f of [A,B]){if(f.ai){f.omega*=D.ai;f.speedMul=D.ai}else{f.dmgTaken=D.taken;f.stunMul=D.stun}}}
 game.fighters=[A,B];game.debris=[];game.fx=[];game.texts=[];
 game.cd=m.demo?0.3:1.8;game.ended=false;game.endCalled=false;game.endT=0;game.slowT=0;game.acc=0;game.winner=-1;
 game.hintT=m.demo||game.round>1?0:m.practice?14:6;game.paused=false;
 game.mercy=null;game.spared=-1;game.fameMul=1;game.flasks=[];game.coins=[];game.coinGold=0;game.zoom=null;
}
function startMercy(i){
 const f=game.fighters[i];
 f.downed=true;f.stun=0;f.removeCons('rigL');f.removeCons('rigR');f.removeCons('rig');
 game.mercy={i,t:1.4,shown:false};game.slowT=0.8;game.excite=2;sfx.cheer();
 addText(f.ctrlType==='ai'?'YIELDS!':'YOU ARE DOWN!',f.neck.x,f.neck.y-70,34,'#ffd24a',2);
}
function mercyScreen(){
 const m=game.mercy,F=game.fighters,down=F[m.i],other=F[1-m.i];
 if(down.ctrlType!=='ai'){
  const dealt=1-other.blood/other.maxBlood+(other.hasArm?0:0.2)+(2-other.legs())*0.15;
  const favor=clamp(0.3+dealt*0.5+(save.meta.diff===0?0.1:0),0.15,0.85);
  show(`<div class="panel result lose"><h1>Missio!</h1><p class="reason">${down.name} is down</p><p>${other.name} looks up at the crowd. Your fate is in their hands...</p><p class="thumbs" id="verdict">. . .</p></div>`);
  setTimeout(()=>{
   if(game.mercy!==m)return;
   const spared=Math.random()<favor,el=document.getElementById('verdict');
   if(el)el.innerHTML=spared?'<b>Thumbs up! The crowd spares you.</b>':'<b>Thumbs down! The crowd wants blood.</b>';
   sfx.cheer();
   setTimeout(()=>{if(game.mercy===m)resolveMercy(spared?'spare':'kill')},1700);
  },2300);
 }else{
  m.wish=Math.random()<0.55?'kill':'spare';
  show(`<div class="panel result win"><h1>Missio!</h1><p class="reason">${down.name} yields</p><p>The crowd is chanting: <b>${m.wish==='kill'?'IUGULA! (Kill!)':'MITTE! (Spare!)'}</b></p><p class="sub">Give the crowd what it wants for bonus fame.</p><br><button class="big" data-a="mercyKill">Kill</button><button class="big alt" data-a="mercySpare">Spare</button></div>`);
 }
}
function resolveMercy(choice){
 const m=game.mercy;if(!m)return;
 const down=game.fighters[m.i];
 hideUI();game.mercy=null;
 if(down.ctrlType==='ai'){
  const ok=choice===m.wish;game.fameMul=ok?1.5:0.75;
  addText(ok?'THE CROWD ROARS!':'THE CROWD BOOS!',W/2,200,30,ok?'#ffd24a':'#ff9a6a',2.2);
 }
 if(choice==='kill'){if(down.hasHead)down.sever('head');down.die('EXECUTED')}
 else{
  game.spared=m.i;game.ended=true;game.endT=1.8;game.winner=1-m.i;game.reason='SPARED';
  addText('SPARED',down.neck.x,down.neck.y-70,34,'#cfe3ff',2);sfx.cheer();
 }
}

 if(!r.choices){r.choices=makeChoices(r);persist()}
 const need=xpNeed(r.level);
 const stat=k=>`<div class="srow"><span>${k.toUpperCase()}</span> ${pips(r.stats[k],10)}${r.pts>0&&r.stats[k]<10?`<button class="arrow" data-a="pt" data-v="${k}">+</button>`:''}</div>`;
 let h=`<div class="panel wide"><h2>${r.name}</h2><p class="sub">Level ${r.level} ${c.name} · ${boutLabel(r)}</p><div class="journey">${AREAS.map((A,i)=>`<span class="stop ${r.grand||i<r.area?'done':i===r.area?'here':''}">${areaShort(r,i)}</span>`).join('<span class="arrowj">›</span>')}</div>
 <div class="row"><div class="stat">Gold <b>${r.gold}</b></div><div class="stat">Fame <b>${M.fame}</b></div><div class="stat">Wins <b>${r.wins}</b></div></div>
 <div class="xp"><i style="width:${Math.min(100,Math.round(r.xp/need*100))}%"></i></div><p class="sub">XP ${r.xp} / ${need}${r.pts?` · <b>${r.pts} stat point${r.pts>1?'s':''} to spend!</b>`:''}</p>
 <div class="cols"><div class="card"><h3>Your gladiator</h3><div class="cols" style="margin:0"><canvas class="cprev" id="me" width="192" height="240"></canvas><div style="flex:1"><p>Gear: <b>${gearName(r.weapon,r.injuries&&r.injuries.arm?null:r.shield)}</b></p><p>Armor: ${armorList(r.armor)}</p>${stat('str')}${stat('agi')}${stat('vit')}${injuryHtml(r)}${wineHtml(r)}</div></div></div></div>
 <h3>${!r.grand&&r.bout>=BOUTS?`Champion of ${areaName(r)}`:'Choose your opponent'}</h3><div class="grid g${r.choices.length}">`;
 r.choices.forEach((o,i)=>{
  if(o.beast){const B=BEASTS[o.beast];h+=`<div class="item"><div class="iname">${o.name}</div><div class="tag" style="color:#7c1a12">Wild beast</div><div class="idesc">${B.desc}<br>Ferocity ${pips(Math.max(1,Math.round(o.ai*5)))}</div><div class="istats">Purse ${o.gold}g · ${o.xp} XP · ${o.fame} fame</div><button data-a="runFight" data-v="${i}">Fight</button></div>`;return}
  const d=o.boss?{l:'Boss',c:'#7c1a12'}:DIFF[o.diff+1];
  h+=`<div class="item"><div class="iname">${o.name}</div><div class="tag" style="color:${d.c}">${d.l} · ${CLASSES[o.cls].name}</div><div class="idesc">${gearName(o.weapon,o.shield)} · ${armorList(o.armor)}<br>STR ${o.stats.str} · AGI ${o.stats.agi} · VIT ${o.stats.vit} · Skill ${pips(Math.max(1,Math.round(o.ai*5)))}</div><div class="istats">Purse ${o.gold}g · ${o.xp} XP · ${o.fame} fame</div><button data-a="runFight" data-v="${i}">Fight</button></div>`;
 });
 h+=`</div><br><button data-a="armory">Armory</button><button class="alt" data-a="ludus">Ludus</button><button class="alt" data-a="title">Menu</button><div><button class="tiny" data-a="retire">Retire this gladiator</button></div></div>`;
 show(h);
 previewFighter(document.getElementById('me'),Object.assign(playerCfg(r),{ctrl:'ai'}));
}
function screenArmory(){
 ensureDemo();
 const r=save.run;if(!r)return screenLudus();
 const T=save.meta.trainers;
 let h=`<div class="panel wide"><h2>Armory</h2><div class="gold">${r.gold} gold</div><p class="sub">Gold and gear belong to this gladiator and are lost when they die.</p><h3>Weapons</h3><div class="grid">`;
 for(const k of WKEYS){
  const w=WEAPONS[k],own=r.owned.includes(k),eq=r.weapon===k,rt=wRate(w),p=shopPrice(w.price);
  h+=`<div class="item ${eq?'eq':''}"><div class="iname">${w.name}</div><canvas class="wprev" data-w="${k}" width="320" height="80"></canvas><div class="idesc">${w.desc}</div><div class="istats">DMG ${pips(rt.dmg)} SPD ${pips(rt.spd)} RCH ${pips(rt.rch)}</div>`+
   (own?(eq?'<span class="tag">Equipped</span>':`<button data-a="equip" data-v="${k}">Equip</button>`):`<button data-a="buy" data-v="w:${k}" ${r.gold<p?'disabled':''}>Buy · ${p}</button>`)+'</div>';
 }
 h+='</div><h3>Armor</h3><div class="grid">';
 for(const k in ARMOR){const a=ARMOR[k],p=shopPrice(a.price);h+=`<div class="item ${r.armor[k]?'eq':''}"><div class="iname">${a.name}</div><div class="idesc">${a.desc}</div>`+(r.armor[k]?'<span class="tag">Owned</span>':`<button data-a="buy" data-v="a:${k}" ${r.gold<p?'disabled':''}>Buy · ${p}</button>`)+'</div>'}
 h+=`</div><h3>Shields</h3>${WEAPONS[r.weapon].twoHanded?'<p class="sub">Your two-handed weapon leaves no hand free for a shield.</p>':''}<div class="grid">`;
 const shs=r.shields||[];
 for(const k of SKEYS){const s=SHIELDS[k],own=shs.includes(k),eq=r.shield===k,p=shopPrice(s.price);h+=`<div class="item ${eq?'eq':''}"><div class="iname">${s.name}</div><div class="idesc">${s.desc}</div>`+(own?(eq?'<span class="tag">Equipped</span>':`<button data-a="eqShield" data-v="${k}">Equip</button>`):`<button data-a="buy" data-v="h:${k}" ${r.gold<p?'disabled':''}>Buy · ${p}</button>`)+'</div>'}
 h+=`<div class="item ${r.shield?'':'eq'}"><div class="iname">No Shield</div><div class="idesc">Fight with one hand free. Hop a little higher without a heavy scutum.</div>`+(r.shield?'<button data-a="eqShield" data-v="none">Unequip</button>':'<span class="tag">Equipped</span>')+'</div>';
 h+='</div><h3>Training</h3><div class="grid">';
 for(const k in STATS){
  const s=STATS[k],v=r.stats[k],cap=tcap(T[k]),c=trainCost(v);
  h+=`<div class="item"><div class="iname">${s.name}</div><div class="idesc">${s.desc}</div><div class="istats">${pips(v,10)}</div>`+
   (v>=10?'<span class="tag">Mastered</span>':v>=cap?`<span class="tag">Trainer limit ${cap}. Upgrade in the Ludus</span>`:`<button data-a="buy" data-v="s:${k}" ${r.gold<c?'disabled':''}>Train · ${c}</button>`)+'</div>';
 }
 h+='</div><br><button data-a="run">Back</button></div>';
 show(h);
 ui.querySelectorAll('canvas.wprev').forEach(cn=>{const g=cn.getContext('2d'),w=WEAPONS[cn.dataset.w];g.scale(2,2);const L=Math.min(130,w.len);drawWeapon(g,80-L/2-6,20,80+L/2-6,20,w,1)});
}
const EXOPP=[{l:'CPU · Easy',ai:0.2},{l:'CPU · Normal',ai:0.5},{l:'CPU · Hard',ai:0.75},{l:'CPU · Brutal',ai:1},{l:'Player 2 (same keyboard)',p2:true}];
const ex={p1:'gladius',p2:'spear',s1:'scutum',s2:'none',opp:1,score:[0,0]};
const SOPTS=['none',...SKEYS];
const shName=s=>s==='none'?'None':SHIELDS[s].name;
const pickRow=(act,label,key,val)=>`<div class="pick"><span>${label}</span><button class="arrow alt" data-a="${act}" data-v="${key}:-1">‹</button><b>${val}</b><button class="arrow alt" data-a="${act}" data-v="${key}:1">›</button></div>`;
function screenExhib(){
 ensureDemo();
 const row=(l,k,v)=>pickRow('exc',l,k,v);
 show(`<div class="panel" style="min-width:32em"><h2>Exhibition</h2><p class="sub">First to 3 wins. Every weapon unlocked.</p>
  ${row('Your weapon','p1',WEAPONS[ex.p1].name)}${row('Your shield','s1',shName(ex.s1))}${row('Opponent','opp',EXOPP[ex.opp].l)}${row('Their weapon','p2',WEAPONS[ex.p2].name)}${row('Their shield','s2',shName(ex.s2))}
  <br><button class="big" data-a="exStart">Fight!</button><button class="alt" data-a="title">Back</button></div>`);
}
const pr={w:'gladius',s:'scutum',atk:0};
function screenPractice(){
 ensureDemo();
 const row=(l,k,v)=>pickRow('prc',l,k,v);
 show(`<div class="panel" style="min-width:32em"><h2>Training Yard</h2><p class="sub">Hit the straw dummy to see how hard your swings land. Nothing here can hurt you.</p>
  ${row('Weapon','w',WEAPONS[pr.w].name)}${row('Shield','s',shName(pr.s))}${row('Dummy','atk',pr.atk?'Swings back (practice blocking)':'Stands still')}
  <br><button class="big" data-a="prStart">Start</button><button class="alt" data-a="title">Back</button></div>`);
}
function prStart(){
 game.practice={last:0,best:0,hits:0,part:''};
 startMatch({
  a:{name:'You',color:'#b3322a',plume:'#e8d24a',weapon:pr.w,shield:pr.s==='none'?null:pr.s,ctrl:'solo'},
  b:{name:'Training Dummy',color:'#9a7b4f',plume:'#c9a46a',weapon:'gladius',ctrl:pr.atk?'ai':'dummy',ai:0.4,dummy:true,look:{skin:'#c9a46a',hair:'#8a6a3a'}},
  practice:true,label:'Training Yard',onEnd:()=>{}});
 hideUI();
}
function exStart(){
 ex.score=[0,0];const o=EXOPP[ex.opp];
 startMatch({
  a:{name:o.p2?'Player 1':'You',color:'#b3322a',plume:'#e8d24a',weapon:ex.p1,shield:ex.s1==='none'?null:ex.s1,ctrl:o.p2?'p1':'solo'},
  b:{name:o.p2?'Player 2':'Rival',color:'#2f5fa8',plume:'#f0f0f0',weapon:ex.p2,shield:ex.s2==='none'?null:ex.s2,ctrl:o.p2?'p2':'ai',ai:o.ai},
  label:()=>`Round ${game.round}  ·  ${ex.score[0]} – ${ex.score[1]}`,
  onEnd:w=>{
   if(w>=0)ex.score[w]++;
   if(ex.score[0]>=3||ex.score[1]>=3){
    const p1w=ex.score[0]>=3,title=o.p2?(p1w?'Player 1 Wins':'Player 2 Wins'):(p1w?'Victory':'Defeat');
    show(`<div class="panel result ${p1w||o.p2?'win':'lose'}"><h1>${title}</h1><p class="reason">${ex.score[0]} – ${ex.score[1]}</p><br><button class="big" data-a="exStart">Rematch</button><button class="alt" data-a="exhib">Menu</button></div>`);
   }else{game.round++;startRound()}
  }});
 hideUI();
}
function playerCfg(r){const c=CLASSES[r.cls],cn=activeCorner();return{name:r.name,color:c.color,plume:c.plume||'#e8d24a',weapon:r.weapon,shield:r.shield||null,armor:Object.assign({},r.armor),stats:Object.assign({},r.stats),mods:c.mods,look:r.look,ctrl:DEBUG?'ai':'solo',ai:0.8,missing:Object.assign({},r.injuries||{}),pegs:Object.assign({},r.pegs||{}),wine:cn?Math.min(r.wine||0,cn.cap):0,corner:cn}}
function runFight(i){
 const r=save.run,o=r&&r.choices&&r.choices[+i];if(!o)return;
 startMatch({a:playerCfg(r),b:Object.assign({},o,{ctrl:'ai'}),label:boutLabel(r),theme:AREAS[r.area].theme,career:true,coinVal:3+r.area*2,onEnd:w=>runEnd(w,o)});
 hideUI();
}
function runEnd(w,o){
 const r=save.run,M=save.meta;if(!r)return;
 const pf=game.fighters[0];if(pf&&pf.corner)r.wine=pf.wine;
 const survive=()=>{const cg=game.coinGold||0;r.gold+=cg;const inj=recordInjuries(r,pf);return(cg?`<p>+${cg} gold picked up from the crowd.</p>`:'')+(inj.length?`<p><b>Injured:</b> lost ${inj.join(' and ')}. Visit the Medicus on your gladiator screen.</p>`:'')};
 if(w===0){
  const mul=1+0.1*M.trainers.lanista,g=Math.round(o.gold*mul),x=Math.round(o.xp*mul*(game.reason==='DECAPITATED!'?1.2:1)),fm=Math.round(o.fame*(game.fameMul||1));
  r.gold+=g;r.xp+=x;r.wins++;r.choices=null;M.fame+=fm;const extra=survive();
  let travel='';
  if(o.boss&&!r.grand){
   if(r.area>=AREAS.length-1){r.grand=true;r.defenses=0;M.fame+=100;travel='<p><b>You are the GRAND CHAMPION OF ROME!</b> +100 bonus fame. Challengers will keep coming to the Colosseum.</p>'}
   else{const from=areaName(r);r.area++;r.bout=0;travel=`<p><b>You conquered ${from}!</b> Word of you spreads. On to the ${AREAS[r.area].name}.</p>`}
   M.bestArea=Math.max(M.bestArea||0,r.grand?AREAS.length:r.area);
  }else if(r.grand)r.defenses=(r.defenses||0)+1;else r.bout++;
  let lv=0;while(r.xp>=xpNeed(r.level)){r.xp-=xpNeed(r.level);r.level++;r.pts++;lv++}
  M.best=Math.max(M.best,r.wins);persist();sfx.coin();
  const crowd=game.fameMul>1?' (the crowd loved it!)':game.fameMul<1?' (the crowd is unhappy)':'';
  show(`<div class="panel result win"><h1>Victory</h1><p class="reason">${game.reason}</p><p>+${g} gold · +${x} XP${game.reason==='DECAPITATED!'?' (beheading bonus)':''} · +${fm} fame${crowd}</p>`+
   (lv?`<p><b>Level up! ${r.name} is now level ${r.level}.</b> Spend your stat points.</p>`:'')+
   travel+extra+
   '<br><button class="big" data-a="run">Continue</button></div>');
 }else if(game.spared===0){
  r.choices=null;const extra=survive();persist();
  show(`<div class="panel result win"><h1>Spared</h1><p class="reason">The crowd shows mercy</p><p>${r.name} limps out of the arena alive, but with no purse.<br>Your run continues.</p>${extra}<br><button class="big" data-a="run">Continue</button></div>`);
 }else{
  const saved=game.reason!=='DECAPITATED!'&&game.reason!=='EXECUTED'&&Math.random()<0.08*M.trainers.medicus;
  if(saved){
   const lost=Math.floor(r.gold/2);r.gold-=lost;r.choices=null;const extra=survive();persist();
   show(`<div class="panel result win"><h1>Saved!</h1><p class="reason">${game.reason}</p><p>The Medicus drags ${r.name} off the sand and stitches them back together.<br>The bill: ${lost} gold.</p>${extra}<br><button class="big" data-a="run">Continue</button></div>`);
  }else endRun(game.reason);
 }
}
function endRun(cause){
 const r=save.run,M=save.meta;if(!r)return screenLudus();
 M.graves.unshift({name:r.name,cls:r.cls,level:r.level,wins:r.wins,cause,where:r.grand?'Rome (Grand Champion)':areaShort(r,r.area)});M.graves=M.graves.slice(0,20);M.runs++;
 save.run=null;persist();
 const ret=cause==='Retired';
 show(`<div class="panel result lose"><h1>${ret?'Retired':'Fallen'}</h1><p class="reason">${ret?'Hangs up the sword':cause}</p><p><b>${r.name}</b> the ${CLASSES[r.cls].name} won ${r.wins} fight${r.wins===1?'':'s'} and reached level ${r.level}.</p><p>Their gold and gear are gone. Your Ludus keeps its fame: <b>${M.fame}</b>. Spend it on trainers and new gladiator types.</p><br><button class="big" data-a="ludus">Return to the Ludus</button></div>`);
}
function pauseScreen(){game.paused=true;const m=game.match||{};show(`<div class="panel"><h2>Paused</h2><button class="big" data-a="resume">Resume</button><br><button class="alt" data-a="forfeit">${m.career?'Surrender (your gladiator dies)':m.practice?'Leave the yard':'Forfeit'}</button></div>`)}
function resume(){game.paused=false;hideUI()}

let armed='';
function confirm2(key,btn,msg){if(armed!==key){armed=key;btn.textContent=msg;setTimeout(()=>{if(armed===key)armed=''},3000);return false}armed='';return true}
const ACTIONS={
 diff(){save.meta.diff=((save.meta.diff|0)+1)%DIFFS.length;persist();screenTitle()},
 title:screenTitle,help:screenHelp,career:screenCareer,ludus:screenLudus,run:screenRun,armory:screenArmory,exhib:screenExhib,exStart,resume,runFight,
 newGlad(){ng.name='';screenNew()},
 forfeit(){game.paused=false;const m=game.match||{};if(m.career&&save.run)endRun('SURRENDERED');else if(m.practice)screenPractice();else screenExhib()},
 practice:screenPractice,prStart,
 prc(v){const [k,d]=v.split(':'),n=+d;if(k==='w')pr.w=WKEYS[(WKEYS.indexOf(pr.w)+n+WKEYS.length)%WKEYS.length];else if(k==='s')pr.s=SOPTS[(SOPTS.indexOf(pr.s)+n+SOPTS.length)%SOPTS.length];else pr.atk=pr.atk?0:1;screenPractice()},
 mercyKill(){resolveMercy('kill')},mercySpare(){resolveMercy('spare')},
 eqShield(k){const r=save.run;if(r){if(k==='none')r.shield=null;else if((r.shields||[]).includes(k))r.shield=k;persist()}screenArmory()},
 trainer(k){const M=save.meta,L=M.trainers[k];if(k in TRAINERS&&L<5&&M.fame>=TCOST[L]){M.fame-=TCOST[L];M.trainers[k]++;persist();sfx.coin()}screenLudus()},
 hireCorner(k){const M=save.meta,d=CORNERS[k];M.corners=M.corners||{};if(d&&M.corners[k]===undefined&&M.fame>=d.cost){M.fame-=d.cost;M.corners[k]=0;M.corner=k;persist();sfx.coin()}screenLudus()},
 upCorner(k){const M=save.meta,d=CORNERS[k],L=(M.corners||{})[k];if(d&&L!==undefined&&L<d.caps.length-1&&M.fame>=d.up[L]){M.fame-=d.up[L];M.corners[k]++;persist();sfx.coin()}screenLudus()},
 setCorner(k){const M=save.meta;if((M.corners||{})[k]!==undefined){M.corner=k;persist()}screenLudus()},
 heal(k){const r=save.run;if(r&&r.injuries&&r.injuries[k]&&r.gold>=medCost(k)){r.gold-=medCost(k);r.injuries[k]=false;if(k!=='arm'){r.pegs=r.pegs||{};r.pegs[k]=true}persist();sfx.coin()}screenRun()},
 buyWine(){const r=save.run,cn=activeCorner();if(r&&cn&&(r.wine||0)<cn.cap&&r.gold>=winePrice()){r.gold-=winePrice();r.wine=(r.wine||0)+1;persist();sfx.coin()}screenRun()},
 unlock(k){const M=save.meta,c=CLASSES[k];if(c&&!M.classes.includes(k)&&M.fame>=c.cost){M.fame-=c.cost;M.classes.push(k);persist();sfx.coin()}screenLudus()},
 reroll(){ng.name=randName();ng.look=randLook(CLASSES[ng.cls]);screenNew()},
 pickCls(k){if(save.meta.classes.includes(k)){ng.cls=k;ng.look=randLook(CLASSES[k]);screenNew()}},
 startRun(){if(!save.run){save.run=newRun(ng.cls,ng.name||randName(),ng.look||randLook(CLASSES[ng.cls]));ng.name='';persist()}screenRun()},
 pt(k){const r=save.run;if(r&&r.pts>0&&k in r.stats&&r.stats[k]<10){r.stats[k]++;r.pts--;persist()}screenRun()},
 equip(v){const r=save.run;if(r&&r.owned.includes(v)){r.weapon=v;persist()}screenArmory()},
 buy(v){
  const r=save.run;if(!r)return screenLudus();
  const [t,k]=v.split(':');let ok=false;
  if(t==='w'){const w=WEAPONS[k];if(w&&!r.owned.includes(k)&&r.gold>=shopPrice(w.price)){r.gold-=shopPrice(w.price);r.owned.push(k);r.weapon=k;ok=true}}
  else if(t==='h'){const s=SHIELDS[k];r.shields=r.shields||[];if(s&&!r.shields.includes(k)&&r.gold>=shopPrice(s.price)){r.gold-=shopPrice(s.price);r.shields.push(k);r.shield=k;ok=true}}
  else if(t==='a'){const a=ARMOR[k];if(a&&!r.armor[k]&&r.gold>=shopPrice(a.price)){r.gold-=shopPrice(a.price);r.armor[k]=true;ok=true}}
  else if(t==='s'&&k in STATS){const s=r.stats[k],c=trainCost(s);if(s<tcap(save.meta.trainers[k])&&s<10&&r.gold>=c){r.gold-=c;r.stats[k]++;ok=true}}
  if(ok){persist();sfx.coin()}screenArmory();
 },
 retire(v,btn){if(confirm2('retire',btn,'Click again to retire (the run ends)'))endRun('Retired')},
 exc(v){
  const [k,d]=v.split(':'),n=+d;
  if(k==='opp')ex.opp=(ex.opp+n+EXOPP.length)%EXOPP.length;
  else if(k==='s1'||k==='s2')ex[k]=SOPTS[(SOPTS.indexOf(ex[k])+n+SOPTS.length)%SOPTS.length];
  else ex[k]=WKEYS[(WKEYS.indexOf(ex[k])+n+WKEYS.length)%WKEYS.length];
  screenExhib();
 },
 reset(v,btn){if(confirm2('reset',btn,'Click again to wipe EVERYTHING')){save={meta:freshMeta(),run:null};persist();screenLudus()}},
};
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;sfx.init();sfx.click();const f=ACTIONS[b.dataset.a];if(f)f(b.dataset.v,b)});

resize();setTheme('colosseum');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildBG()).catch(()=>{});
screenTitle();
if(DEBUG){
 ACTIONS.dbgBeast=k=>{const r=save.run;if(r){const o=genBeast(r);o.beast=BEASTS[k]?k:'lion';o.name=BEASTS[o.beast].title;r.choices=[o]}};
 ACTIONS.dbgInjure=()=>{const r=save.run;if(r){r.injuries={arm:true,legL:true};r.pegs={legR:true};r.gold=500}};
 const fm=location.hash.match(/fame=(\d+)/);if(fm)save.meta.fame=+fm[1];
 const m=location.hash.match(/debug=([\w+:]+)/);if(m)for(const a of m[1].split('+')){const [n,v]=a.split(':');if(ACTIONS[n])ACTIONS[n](v||'0')}
 const th=location.hash.match(/theme=(\w+)/);if(th)setTheme(th[1]);
 const pq=location.hash.match(/pts=(\d+)/);if(pq&&save.run){save.run.pts=+pq[1];save.run.stats.str=9;screenRun()}
 if(/callwine/.test(location.hash)){game.cd=0;const f=game.fighters[0];f.blood*=0.5;f.wineCD=0;callWine(f)}
 const mq=location.hash.match(/mercy=(\d)/);if(mq){game.cd=0;startMercy(+mq[1])}
 const s=location.hash.match(/sim=(\d+)/);
 if(s){const log=[];for(let i=0;i<+s[1];i++){update(1/60);if(i%60===0)log.push(game.fighters.map(f=>`${f.alive?'A':'D'} x${f.pelvis.x|0} y${f.pelvis.y|0} hy${f.hasHead?f.head.y|0:'-'} bl${f.blood|0} g${f.grounded?1:0}`).join(' | '))}
  const p=document.createElement('pre');p.style.cssText='position:fixed;left:0;bottom:0;color:#0f0;background:rgba(0,0,0,.8);z-index:9;margin:0;font-size:11px';p.textContent=log.slice(-14).join('\n');document.body.appendChild(p)}
}
requestAnimationFrame(loop);
</script>
</body>
